name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem o v prefix, ex: 1.2.3). Vazio = usa última tag git.'
        required: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack-publish:
    runs-on: windows-latest
    permissions:
      contents: write    # criar GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Rpc.slnx

      - name: Build (Release)
        run: dotnet build Rpc.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Rpc.slnx -c Release --no-build

      - name: Pack NuGets
        run: dotnet pack Rpc.slnx -c Release --no-build --output ${{ github.workspace }}/artifacts

      - name: Publish single-file Sample.LocalAgent (win-x64)
        run: dotnet publish samples/Sample.LocalAgent/Sample.LocalAgent.csproj -c Release -r win-x64 --self-contained true -o ${{ github.workspace }}/artifacts/agent-win-x64

      - name: Publish single-file Sample.LocalAgent (linux-x64)
        run: dotnet publish samples/Sample.LocalAgent/Sample.LocalAgent.csproj -c Release -r linux-x64 --self-contained true -o ${{ github.workspace }}/artifacts/agent-linux-x64

      - name: Zip agent artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/agent-win-x64/* -DestinationPath artifacts/rpckit-sample-agent-win-x64.zip
          Compress-Archive -Path artifacts/agent-linux-x64/* -DestinationPath artifacts/rpckit-sample-agent-linux-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpckit-release
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.zip

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.zip
          generate_release_notes: true
